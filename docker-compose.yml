# Docker Compose file for the project

x-airflow-common:
  &airflow-common
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor # Airflow executor (Current - CeleryExecutor, LocalExecutor is the default executor)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB} # Airflow database connection string
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./dbt_proyecto:/opt/airflow/dbt_proyecto
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    - postgres

services:
  # Postgres service
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  # Airflow webserver service
  airflow-webserver:
      <<: *airflow-common
      command: webserver
      ports:
        - "${AIRFLOW_PORT}:8080"
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
        interval: 10s
        timeout: 10s
        retries: 5

  airflow-scheduler:
      <<: *airflow-common
      command: scheduler

  airflow-init:
      <<: *airflow-common
      command: bash -c "airflow db migrate && airflow users create \
        --username admin \
        --password admin \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com"

volumes:
  postgres-db-volume:
